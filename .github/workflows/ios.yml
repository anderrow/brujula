name: iPhone checks

on:
  push:
    branches: [main]
    paths: ['ios/**', 'app/src/main/assets/web/core.js', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'app/src/main/assets/web/core.js', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backup compatibility and reminder dates
        run: |
          node ios/Tests/localizations.cjs
          node ios/Tests/android-fixture.cjs "$RUNNER_TEMP/android-backup.json"
          swiftc ios/Brujula/Localization.swift ios/Brujula/ReflectionModel.swift ios/Brujula/ReminderSchedule.swift ios/Tests/main.swift -o "$RUNNER_TEMP/ios-checks"
          "$RUNNER_TEMP/ios-checks" "$RUNNER_TEMP/android-backup.json"
      - name: Build for iPhone Simulator
        run: |
          xcodebuild -project ios/Brujula.xcodeproj -scheme Brujula -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/brujula-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone hardware without signing
        run: |
          xcodebuild -project ios/Brujula.xcodeproj -scheme Brujula -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/brujula-device" CODE_SIGNING_ALLOWED=NO build
      - name: Launch on an iPhone Simulator
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k,ds in reversed(sorted(data.items())) if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')
          echo "BRUJULA_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$RUNNER_TEMP/brujula-simulator/Build/Products/Debug-iphonesimulator/Brujula.app"
          xcrun simctl launch "$simulator" app.brujula.life.ios
          sleep 4
          xcrun simctl io "$simulator" screenshot "$RUNNER_TEMP/brujula-iphone.png"
          xcrun simctl terminate "$simulator" app.brujula.life.ios
      - name: Exercise wheel gestures, persistence, and reminder controls
        run: |
          xcodebuild -project ios/Brujula.xcodeproj -scheme Brujula -configuration Debug -destination "platform=iOS Simulator,id=$BRUJULA_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/brujula-simulator" -resultBundlePath "$RUNNER_TEMP/brujula-ui.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/brujula-ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/brujula-ui.xcresult" --output-path "$RUNNER_TEMP/brujula-ui-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brujula-iphone-simulator-preview
          path: |
            ${{ runner.temp }}/brujula-iphone.png
            ${{ runner.temp }}/brujula-ui-screenshots/*.png
            ${{ runner.temp }}/brujula-ui-screenshots/*.txt
            ${{ runner.temp }}/brujula-ui-screenshots/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brujula-iphone-test-results
          path: |
            ${{ runner.temp }}/brujula-ui.xcresult/
          if-no-files-found: ignore
