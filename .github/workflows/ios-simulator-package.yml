name: iPhone interactive simulator package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the native app for an ARM iPhone simulator
        run: |
          xcodebuild -project ios/Brujula.xcodeproj -scheme Brujula -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/brujula-interactive" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package the simulator app
        run: |
          app=$(python3 -c 'import os; from pathlib import Path; apps=list((Path(os.environ["RUNNER_TEMP"])/"brujula-interactive/Build/Products/Release-iphonesimulator").glob("*.app")); assert len(apps)==1, "Expected one simulator app"; print(apps[0])')
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          output="$RUNNER_TEMP/interactive-package"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = 'iPhoneSimulator'
          test "$(xcrun lipo -archs "$app/$executable")" = 'arm64'
          mkdir -p "$output"
          ditto -c -k --keepParent "$app" "$output/Brujula-iOS-Simulator.zip"
          (
            cd "$output"
            shasum -a 256 Brujula-iOS-Simulator.zip > Brujula-iOS-Simulator.zip.sha256
          )
          printf 'Brújula native iOS simulator build\nCommit: %s\nArchitecture: arm64\n\nUpload Brujula-iOS-Simulator.zip to Appetize. This is an unsigned simulator app, not an IPA for a physical iPhone. The package contains no saved reflections or reminder settings.\n' "$GITHUB_SHA" > "$output/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: brujula-ios-interactive-simulator
          path: ${{ runner.temp }}/interactive-package/
          if-no-files-found: error
          retention-days: 7
