plugins { id 'com.android.application' }

android {
    namespace 'app.brujula.life'
    compileSdk 36
    defaultConfig {
        applicationId 'app.brujula.life'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.3.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('BRUJULA_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('BRUJULA_STORE_PASSWORD')
                keyAlias 'brujula'
                keyPassword System.getenv('BRUJULA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'user.home', rootProject.file('.toolchain/test-home').absolutePath
            systemProperty 'java.io.tmpdir', rootProject.file('.toolchain/tmp').absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            doFirst {
                rootProject.file('.toolchain/test-home').mkdirs()
                rootProject.file('.toolchain/tmp').mkdirs()
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
